# https://wiki.mikr.us/strych_backupy/
- name: Install rsnappush dependencies
  ansible.builtin.apt:
    name:
      - acl
      - rsync
    state: present
    update_cache: true

- name: Install rsnappush
  ansible.builtin.get_url:
    url: https://mikr.us/tools/rsnappush
    dest: /usr/local/bin/rsnappush
    mode: "0755"

- name: Configure SSH for backup server
  ansible.builtin.copy:
    dest: ~/.ssh/config
    mode: "0600"
    content: |
      Host strych.mikr.us
        User eve249
        Port 10249
        IdentityFile /backup_key
        IdentitiesOnly yes

