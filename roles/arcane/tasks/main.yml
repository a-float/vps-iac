- name: Create Arcane directory
  ansible.builtin.file:
    path: "/opt/arcane"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Arcane compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "/opt/arcane/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start Arcane
  community.docker.docker_compose_v2:
    project_src: "/opt/arcane"
    files:
      - compose.yml
    state: present
    pull: missing
