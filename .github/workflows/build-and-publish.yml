name: Build and Publish Docker Images

on:
  push:
    branches: [ main ]
    paths:
      - 'submodules/nanobot/**'
      - 'nanobot-image/**'
  workflow_dispatch:

jobs:
  build-and-publish:
    if: github.event_path && (github.event.changed.paths == 'submodules/nanobot/**' || github.event.changed.paths == 'nanobot-image/**')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: afloaty
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Get Git commit hashes
      id: git-info
      run: |
        ROOT="$(pwd)"
        NANOBOT="$ROOT/submodules/nanobot"
        
        UPSTREAM_SHA="$(git -C "$NANOBOT" rev-parse --short=12 HEAD)"
        CUSTOM_SHA="$(git -C "$ROOT" rev-parse --short=12 HEAD)"
        
        echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
        echo "custom_sha=$CUSTOM_SHA" >> $GITHUB_OUTPUT
    
    - name: Build and push upstream Nanobot
      run: |
        ROOT="$(pwd)"
        NANOBOT="$ROOT/submodules/nanobot"
        UPSTREAM_SHA="${{ steps.git-info.outputs.upstream_sha }}"
        
        BASE_IMAGE="nanobot-base:${UPSTREAM_SHA}"
        
        echo "==> Building upstream Nanobot:"
        echo "    ${BASE_IMAGE}"
        
        docker build \
          --build-arg NANOBOT_CHANNELS="${{ secrets.NANOBOT_CHANNELS || 'whatsapp' }}" \
          --build-arg NANOBOT_EXTRAS="${{ secrets.NANOBOT_EXTRAS || '' }}" \
          -f "$NANOBOT/Dockerfile" \
          -t "$BASE_IMAGE" \
          "$NANOBOT"
        
        docker push "$BASE_IMAGE"
    
    - name: Build and push custom Nanobot
      run: |
        ROOT="$(pwd)"
        NANOBOT="$ROOT/submodules/nanobot"
        UPSTREAM_SHA="${{ steps.git-info.outputs.upstream_sha }}"
        CUSTOM_SHA="${{ steps.git-info.outputs.custom_sha }}"
        
        FINAL_IMAGE="docker.io/afloaty/nanobot"
        FINAL_IMAGE_VERSION="${FINAL_IMAGE}:nanobot-${UPSTREAM_SHA}-custom-${CUSTOM_SHA}"
        FINAL_IMAGE_LATEST="${FINAL_IMAGE}:latest"
        
        echo "==> Building custom Nanobot:"
        echo "    ${FINAL_IMAGE_VERSION}"
        echo "    ${FINAL_IMAGE_LATEST}"
        
        docker build \
          --build-arg NANOBOT_BASE_IMAGE="nanobot-base:${UPSTREAM_SHA}" \
          -f "$ROOT/nanobot-image/Dockerfile" \
          -t "$FINAL_IMAGE_VERSION" \
          -t "$FINAL_IMAGE_LATEST" \
          "$ROOT/nanobot-image"
        
        docker push "$FINAL_IMAGE_VERSION"
        docker push "$FINAL_IMAGE_LATEST"
        
        echo
        echo "=========================================="
        echo "Published:"
        echo
        echo "  ${FINAL_IMAGE_VERSION}"
        echo "  ${FINAL_IMAGE_LATEST}"
        echo "=========================================="
    
    - name: Clean up
      run: |
        docker rmi "nanobot-base:${{ steps.git-info.outputs.upstream_sha }}" || true
        docker rmi "docker.io/afloaty/nanobot:nanobot-${{ steps.git-info.outputs.upstream_sha }}-custom-${{ steps.git-info.outputs.custom_sha }}" || true
        docker rmi "docker.io/afloaty/nanobot:latest" || true